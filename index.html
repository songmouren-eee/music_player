<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐播放器</title>
    <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航 -->
        <header class="app-header">
            <div class="app-logo">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                <span>音乐播放器</span>
            </div>
            <div class="header-actions">
                <button class="header-btn" id="queueBtn" title="播放队列">
                    <svg viewBox="0 0 24 24"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
                </button>
                <button class="header-btn" id="settingsBtn" title="设置">
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                </button>
            </div>
        </header>

        <!-- 搜索视图 -->
        <section id="searchView" class="view active">
            <div class="search-hero">
                <h1>发现好音乐</h1>
                <p>搜索你喜欢的歌曲，即刻享受高品质音乐</p>
            </div>

            <!-- 标签页 -->
            <div class="tabs">
                <button class="tab-btn active" id="tabSearch">搜索</button>
                <button class="tab-btn" id="tabFavorites">我的收藏</button>
                <button class="tab-btn" id="tabHistory">播放历史</button>
            </div>

            <!-- 搜索栏 -->
            <div class="search-bar" id="searchBarArea">
                <div class="search-row">
                    <div class="input-group" style="flex: 2;">
                        <label>歌曲 / 歌手</label>
                        <input type="text" id="keywordInput" placeholder="输入关键词，如：小少焱">
                    </div>
                    <div class="input-group">
                        <label>音质</label>
                        <select id="qualitySelect">
                            <option value="lossless">无损</option>
                            <option value="exhigh">极高</option>
                            <option value="standard">标准</option>
                            <option value="hires">Hi-Res</option>
                        </select>
                    </div>
                </div>
                <div class="search-row">
                    <div class="input-group">
                        <label>返回数量</label>
                        <input type="number" id="limitInput" value="10" min="1" placeholder="自定义数量">
                    </div>
                    <div class="input-group" style="flex: 0 0 auto; justify-content: flex-end;">
                        <button class="search-btn" id="searchBtn">搜索</button>
                    </div>
                </div>
            </div>

            <!-- 搜索历史 -->
            <div class="search-history" id="searchHistoryArea">
                <div class="search-history-header">
                    <span>搜索历史</span>
                    <button class="clear-history-btn" id="clearSearchHistory">清空</button>
                </div>
                <div class="history-tags" id="searchHistory">
                    <span class="history-empty">暂无搜索历史</span>
                </div>
            </div>

            <!-- 本地导入 -->
            <div class="local-import">
                <button class="import-btn" id="localImportBtn">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    导入本地音乐
                </button>
                <input type="file" id="localFileInput" accept="audio/*" style="display:none">
                <label class="lyric-import-label">
                    <input type="file" id="localLyricInput" accept=".lrc,.txt" style="display:none">
                    （可选：同时选择LRC歌词文件）
                </label>
            </div>

            <!-- 搜索结果 -->
            <div class="results-header" id="resultsHeader" style="display: none;">
                <h2>搜索结果</h2>
                <span class="results-count" id="resultsCount"></span>
            </div>
            <div class="song-list" id="songList">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                    <p>输入关键词开始搜索音乐</p>
                </div>
            </div>

            <!-- 底部迷你播放器 -->
            <div class="mini-player" id="miniPlayer" style="display:none">
                <img class="mini-cover" id="miniCover" src="" alt="">
                <div class="mini-info" id="miniInfo">
                    <div class="mini-title" id="miniTitle">--</div>
                    <div class="mini-artist" id="miniArtist">--</div>
                </div>
                <div class="mini-controls">
                    <button class="mini-btn" id="miniPrevBtn" title="上一首">
                        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="mini-btn mini-play" id="miniPlayBtn" title="播放/暂停">
                        <svg id="miniPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button class="mini-btn" id="miniNextBtn" title="下一首">
                        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- 播放视图 -->
        <section id="playerView" class="view player-view">
            <div class="player-header">
                <button class="back-btn" id="backBtn">
                    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                    返回
                </button>
                <div class="player-actions">
                    <button class="player-action-btn" id="playModeBtn" title="播放模式">
                        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                    </button>
                    <button class="player-action-btn" id="favoriteBtn" title="收藏">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </button>
                    <button class="player-action-btn" id="downloadBtn" title="下载">
                        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                    </button>
                </div>
            </div>

            <div class="player-main">
                <div class="vinyl-container">
                    <div class="vinyl paused" id="vinyl">
                        <img class="vinyl-cover" id="vinylCover" src="" alt="封面">
                        <div class="vinyl-center"></div>
                    </div>
                    <div class="tonearm" id="tonearm"></div>
                </div>

                <div class="track-info">
                    <div class="track-title" id="trackTitle">加载中...</div>
                    <div class="track-artist" id="trackArtist">--</div>
                </div>

                <div class="lyric-container" id="lyricContainer">
                    <div class="lyric-line">歌词加载中...</div>
                </div>
            </div>

            <div class="player-controls">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">00:00</span>
                    <span id="totalTime">00:00</span>
                </div>
                <div class="control-buttons">
                    <button class="ctrl-btn" id="prevBtn" title="上一首">
                        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="ctrl-btn play-btn" id="playPauseBtn" title="播放/暂停">
                        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button class="ctrl-btn" id="nextBtn" title="下一首">
                        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>
            </div>
        </section>
    </div>

    <!-- 播放队列面板 -->
    <div class="panel-overlay" id="queueOverlay"></div>
    <div class="side-panel" id="queuePanel">
        <div class="panel-header">
            <h3>播放队列</h3>
            <button class="panel-close" id="queueCloseBtn">×</button>
        </div>
        <div class="panel-content">
            <div class="song-list" id="queueList">
                <div class="empty-state"><p>队列为空</p></div>
            </div>
        </div>
    </div>

    <!-- 设置面板 -->
    <div class="panel-overlay" id="settingsOverlay"></div>
    <div class="side-panel" id="settingsPanel">
        <div class="panel-header">
            <h3>设置</h3>
            <button class="panel-close" id="settingsCloseBtn">×</button>
        </div>
        <div class="panel-content">
            <div class="setting-item">
                <label>音量</label>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="1">
                <div class="volume-value" id="volumeValue">100%</div>
            </div>
            <div class="setting-item">
                <label>播放速度</label>
                <select id="speedSelect">
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1.0" selected>1.0x（正常）</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2.0">2.0x</option>
                </select>
            </div>
            <div class="setting-item">
                <label>主题</label>
                <select id="themeSelect">
                    <option value="dark">深色模式</option>
                    <option value="light">浅色模式</option>
                </select>
            </div>
            <div class="setting-item">
                <label>歌词字号</label>
                <select id="fontSizeSelect">
                    <option value="small">小</option>
                    <option value="medium" selected>中</option>
                    <option value="large">大</option>
                </select>
            </div>
            <div class="setting-item">
                <label>缓存管理</label>
                <button class="clear-cache-btn" id="clearCacheBtn">清除全部缓存</button>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <audio id="nativeAudio" preload="metadata"></audio>

    <script src="js/config.js"></script>
    <script src="js/cache.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/lyric.js"></script>
    <script src="js/player.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
